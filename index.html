<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC 311 Service Requests Dashboard</title>

    <!-- ArcGIS API 4.x CSS -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">

    <!-- Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1>NYC 311 Service Requests Dashboard</h1>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Requests</span>
                        <span class="stat-value" id="totalRequests">Loading...</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Open</span>
                        <span class="stat-value" id="openRequests">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Closed</span>
                        <span class="stat-value" id="closedRequests">-</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="dashboard-content">
            <!-- Sidebar with filters and stats -->
            <aside class="sidebar">
                <div class="filter-panel">
                    <h3>Filters</h3>

                    <div class="filter-group">
                        <label for="dateRange">Date Range</label>
                        <select id="dateRange" class="filter-select">
                            <option value="7">Last 7 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                            <option value="365">Last Year</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="borough">Borough</label>
                        <select id="borough" class="filter-select">
                            <option value="all">All Boroughs</option>
                            <option value="MANHATTAN">Manhattan</option>
                            <option value="BROOKLYN">Brooklyn</option>
                            <option value="QUEENS">Queens</option>
                            <option value="BRONX">Bronx</option>
                            <option value="STATEN ISLAND">Staten Island</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="status">Status</label>
                        <select id="status" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="complaintType">Complaint Type</label>
                        <select id="complaintType" class="filter-select">
                            <option value="all">All Types</option>
                            <option value="Noise">Noise</option>
                            <option value="Heat/Hot Water">Heat/Hot Water</option>
                            <option value="Street Condition">Street Condition</option>
                            <option value="Illegal Parking">Illegal Parking</option>
                            <option value="Water System">Water System</option>
                            <option value="Homeless">Homeless</option>
                        </select>
                    </div>

                    <button id="applyFilters" class="btn-primary">Apply Filters</button>
                    <button id="resetFilters" class="btn-secondary">Reset</button>
                </div>

                <!-- Top Complaint Types Chart -->
                <div class="chart-panel">
                    <h3>Top Complaint Types</h3>
                    <canvas id="complaintTypesChart"></canvas>
                </div>

                <!-- Status Distribution Chart -->
                <div class="chart-panel">
                    <h3>Status Distribution</h3>
                    <canvas id="statusChart"></canvas>
                </div>
            </aside>

            <!-- Main Map Area -->
            <main class="main-content">
                <div class="map-container">
                    <div id="viewDiv"></div>

                    <!-- Map Legend -->
                    <div class="map-legend">
                        <h4>Request Status</h4>
                        <div class="legend-item">
                            <span class="legend-icon open"></span>
                            <span>Open</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-icon closed"></span>
                            <span>Closed</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-icon pending"></span>
                            <span>Pending</span>
                        </div>
                    </div>

                    <!-- Loading Indicator -->
                    <div id="loadingIndicator" class="loading-indicator">
                        <div class="spinner"></div>
                        <p>Loading data...</p>
                    </div>
                </div>

                <!-- Bottom Charts Section -->
                <div class="bottom-charts">
                    <div class="chart-container">
                        <h3>Requests Over Time</h3>
                        <canvas id="timelineChart"></canvas>
                    </div>

                    <div class="chart-container">
                        <h3>Requests by Borough</h3>
                        <canvas id="boroughChart"></canvas>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ArcGIS API 4.x -->
    <script src="https://js.arcgis.com/4.28/"></script>

    <!-- Custom JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
